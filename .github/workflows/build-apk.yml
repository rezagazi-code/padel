name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Ensure Android SDK platform
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Extract Supabase config from live web bundle
        # The anon key is public by design (it ships inside the app).
        # If the Render deploy has VITE_ vars baked in, reuse them here.
        # Otherwise the build continues without backend config.
        run: |
          SITE="https://padel-e09q.onrender.com"
          JS=$(curl -s "$SITE/" | grep -o '/assets/index-[^"]*\.js' | head -1)
          if [ -n "$JS" ]; then
            curl -s "$SITE$JS" -o /tmp/bundle.js
            # New Supabase publishable key format (sb_publishable_...) or legacy JWT
            KEY=$(grep -o 'sb_publishable_[A-Za-z0-9_\-]\+' /tmp/bundle.js | head -1 || true)
            if [ -z "$KEY" ]; then
              KEY=$(grep -o 'eyJ[A-Za-z0-9_.-]\{100,\}' /tmp/bundle.js | head -1 || true)
            fi
            if [ -n "$KEY" ]; then
              echo "VITE_SUPABASE_URL=https://psgzisrzgddcvfkdlpyd.supabase.co" >> $GITHUB_ENV
              echo "VITE_SUPABASE_ANON_KEY=$KEY" >> $GITHUB_ENV
              echo "Supabase config extracted from live bundle"
            else
              echo "No anon key in live bundle; building without backend config"
            fi
          else
            echo "Could not fetch live bundle; building without backend config"
          fi

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build release APK (unsigned)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: padelpro-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
