// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        // Fast mirrors (google()/mavenCentral() kept as fallback)
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        // Local vendored AARs first (no network): poolakey for Cafe Bazaar billing.
        // :app resolves the transitive poolakey AAR via the root repos (not the
        // plugin's own flatDir), so without this it depends on mirrors proxying
        // a jitpack artifact — which broke builds during mirror outages.
        flatDir { dirs "$rootDir/../vendor" }
        // Fast mirrors (google()/mavenCentral() kept as fallback)
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
